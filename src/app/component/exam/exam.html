@defer (on idle) {
  <div class="grid grid-cols-1 gap-4 p-4">
    @for (exam of exams()?.payload?.data; track exam.id) {
      <div class="group relative flex flex-col md:flex-row items-center p-6 bg-white border border-slate-200 rounded-xl transition-all duration-300 hover:shadow-lg hover:border-blue-400 overflow-hidden">

        <div class="w-28 h-28 shrink-0 bg-slate-50 rounded-lg flex items-center justify-center p-4 border border-slate-100">
          <img [src]="exam.image" [alt]="exam.title" class="max-w-full max-h-full object-contain">
        </div>

        <div class="mt-4 md:mt-0 md:ml-6 grow">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
            <h3 class="text-xl font-bold text-blue-700">{{ exam.title }}</h3>

            <div class="flex items-center gap-4 text-slate-500 text-sm">
              <span class="flex items-center gap-1">
                <i class="pi pi-question-circle"></i> {{ exam.questionsCount }} Questions
              </span>
              <span class="flex items-center gap-1">
                <i class="pi pi-clock"></i> {{ exam.duration }} mins
              </span>
            </div>
          </div>

          <p class="mt-2 text-slate-400 text-sm leading-relaxed line-clamp-2 max-w-3xl">
            {{ exam.description }}
          </p>
        </div>

        <div class="absolute right-6 bottom-6 opacity-0 translate-x-12 transition-all duration-500 ease-in-out group-hover:opacity-100 group-hover:translate-x-0">
          <button class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2 rounded-md font-semibold flex items-center gap-2 shadow-md">
            START <span class="text-lg">→</span>
          </button>
        </div>
      </div>
    }
  </div>
}
@loading (minimum 500ms) {
  <div class="grid grid-cols-1 gap-4 p-4">
    @for (_ of [1, 2, 3]; track $index) {
      <div class="flex flex-col md:flex-row items-center p-6 bg-white border border-slate-100 rounded-xl gap-6">
        <p-skeleton width="112px" height="112px" borderRadius="8px" />
        <div class="grow w-full">
          <div class="flex justify-between mb-4">
            <p-skeleton width="40%" height="1.5rem" />
            <p-skeleton width="20%" height="1rem" />
          </div>
          <p-skeleton width="100%" height="1rem" styleClass="mb-2" />
          <p-skeleton width="80%" height="1rem" />
        </div>
      </div>
    }
  </div>
}
